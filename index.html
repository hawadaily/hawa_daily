<!DOCTYPE html>
<html lang="dv" dir="rtl" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ހަވާ ޑެއިލީ - Maldives news portal with Dhivehi RTL support, PWA install, and modern mobile + desktop experiences." />
    <meta name="theme-color" content="#0ea5e9" />
    <title>ހަވާ ޑެއިލީ | Hawa Daily</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/jpeg" href="/HAWA LOGO.jpg" />
    <link rel="apple-touch-icon" href="/HAWA LOGO.jpg" />
    <meta property="og:title" content="ހަވާ ޑެއިލީ - Hawa Daily" />
    <meta property="og:description" content="Modern Maldives news portal with full Dhivehi RTL support and PWA experience." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="dv" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- PWA meta tags for proper app behavior -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <!-- Facebook In-App Browser Prompt -->
    <div id="fb-prompt" style="display: none; position: fixed; top: 0; left: 0; right: 0; background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%); padding: 16px; z-index: 9999; text-align: center; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
      <p style="margin: 0 0 12px 0; font-size: 14px; color: white;">
        މި ލިންކް ބްރައުޒަރުގައި ހުޅުވާލައި އެޕް އެކްސްޕީރިއެންސް ހޯދާ
      </p>
      <button onclick="openInBrowser()" style="background: white; color: #0ea5e9; border: none; padding: 10px 24px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer;">
        Open in Browser
      </button>
      <button onclick="document.getElementById('fb-prompt').style.display='none'" style="background: transparent; color: white; border: 1px solid white; padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; margin-right: 8px;">
        ✕
      </button>
    </div>
    
    <div id="root"></div>
    <script>
      // Detect Facebook in-app browser and show prompt
      (function() {
        const ua = navigator.userAgent || navigator.vendor || window.opera;
        const isFbApp = ua.indexOf('FBAN') > -1 || ua.indexOf('FBAV') > -1 || ua.indexOf('Instagram') > -1;
        
        if (isFbApp) {
          document.getElementById('fb-prompt').style.display = 'block';
        }
      })();
      
      function openInBrowser() {
        const url = window.location.href;
        // Try to open in default browser
        if (navigator.userAgent.match(/Android/i)) {
          window.location.href = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';
        } else if (navigator.userAgent.match(/iPhone|iPad|iPod/i)) {
          window.location.href = url;
        } else {
          window.open(url, '_blank');
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      // Load Facebook SDK
      const fbAppId = import.meta.env.VITE_FACEBOOK_APP_ID || '';

      window.fbAsyncInit = function() {
        if (window.FB && fbAppId) {
          window.FB.init({
            appId: fbAppId,
            xfbml: true,
            version: 'v20.0'
          });
        }
      };

      (function(d, s, id) {
        const js = d.createElement(s);
        js.id = id;
        js.src = 'https://connect.facebook.net/en_US/sdk.js';
        const fjs = d.getElementsByTagName(s)[0];
        if (fjs) {
          fjs.parentNode.insertBefore(js, fjs);
        } else {
          d.head.appendChild(js);
        }
      }(document, 'script', 'facebook-jssdk'));
    </script>
  </body>
</html>
